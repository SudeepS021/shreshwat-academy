<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Shreshwat Academy</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 35px;
            width: 350px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #102a43;
        }

        p {
            text-align: center;
            color: #666;
            font-size: 14px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 11px;
            margin-top: 7px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 22px;
            background: #102a43;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #d4a017;
        }

        a {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #102a43;
            text-decoration: none;
        }

        .message {
            color: red;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Reset Password</h2>

        <p>Enter your registered email and date of birth to reset your password.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <p class="message">{{ message }}</p>
            {% endfor %}
        {% endwith %}

        <form method="POST">

            <label>Email Address</label>
            <input type="email"
                   name="email"
                   placeholder="Enter registered email"
                   required>

            <label>Date of Birth</label>
            <input type="date"
                   name="dob"
                   required>

            <label>New Password</label>
            <input type="password"
                   name="new_password"
                   placeholder="Enter new password"
                   required>

            <label>Confirm New Password</label>
            <input type="password"
                   name="confirm_password"
                   placeholder="Confirm new password"
                   required>

            <button type="submit">Reset Password</button>

        </form>

        <a href="{{ url_for('login') }}">Back to Login</a>

    </div>

</body>
</html>
